name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build DPI installer payload
        run: |
          if [ ! -f app/src/main/assets/payload.bin ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules -b DN8 https://github.com/marcussacana/DirectPackageInstaller /tmp/dpi
            src=$(find /tmp/dpi -name info.c | head -n1)
            test -n "$src" || { echo "info.c not found"; find /tmp/dpi -maxdepth 3 | head -60; exit 1; }
            d=$(dirname "$src")
            echo "payload dir: $d"; ls -la "$d"
            p=$(find /tmp/dpi -name payload.bin | head -n1)
            if [ -z "$p" ]; then
              make -C "$d"
              p=$(find "$d" -name payload.bin | head -n1)
            fi
            test -n "$p" || { echo "payload.bin missing after make"; ls -la "$d"; exit 1; }
            mkdir -p app/src/main/assets && cp "$p" app/src/main/assets/payload.bin
          fi
          python3 -c "d=open('app/src/main/assets/payload.bin','rb').read(); assert b'\\xb4'*6 in d, 'marker missing'; print('payload ok', len(d))"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ps4ctl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
